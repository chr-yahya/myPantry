<div class="auth-container">
  <h2>Connexion</h2>
  <form (ngSubmit)="onSubmit()">
    <div>
      <label>Email :</label>
      <input type="email" [(ngModel)]="email" name="email" required />
    </div>

    <div>
      <label>Mot de passe :</label>
      <input type="password" [(ngModel)]="password" name="password" required />
    </div>

    <p *ngIf="errorMessage" style="color: red;">{{ errorMessage }}</p>
    <p *ngIf="successMessage" style="color: green;">{{ successMessage }}</p>

    <button type="submit">Se connecter</button>
    <button type="button" (click)="resetPassword()">Mot de passe oublié ?</button>
  </form>

  <button type="button" (click)="signInWithGoogle()">Continuer avec Google</button>

<p>Pas encore de compte ? <a routerLink="/sign-up">Créer un compte</a></p>
</div>
