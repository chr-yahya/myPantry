<div class="auth-container">
  <h2>Créer un compte</h2>
  <form (ngSubmit)="onSubmit()">
    <div>
      <label>Email :</label>
      <input type="email" [(ngModel)]="email" name="email" required />
    </div>

    <div>
      <label>Mot de passe :</label>
      <input type="password" [(ngModel)]="password" name="password" minlength="6" required />
    </div>

    <div>
      <label>Confirmer le mot de passe :</label>
      <input type="password" [(ngModel)]="confirmPassword" name="confirmPassword" minlength="6" required />
    </div>

    <p *ngIf="errorMessage" style="color: red;">{{ errorMessage }}</p>

    <button type="submit">S'inscrire</button>
  </form>

  <p>Déjà un compte ? <a routerLink="/sign-in">Se connecter</a></p>
</div>
